name: Desktop builds

# Builds Linux, macOS and Windows packages on every push to main, on version tags and by hand.
# A version tag (vX.Y.Z matching the app version) also publishes a GitHub Release with every
# package, SHA256SUMS.txt and latest.json, using the built-in GITHUB_TOKEN. Packages are not
# code-signed; tag builds sign the updater packages with the Tauri updater key (ADR 0015), set in
# the repository secrets TAURI_UPDATER_PUBLIC_KEY, TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD.

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # Never cancel a release build half-way.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # Third-party actions are pinned to commit SHAs (comment = release tag).
  # Tag builds use no dependency caches: a poisoned cache must never reach a release.
  USE_CACHE: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.USE_CACHE == 'true'
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in shipped JS dependencies
        run: pnpm audit --prod
      - name: Frontend checks
        run: pnpm check
      - name: Frontend build
        run: pnpm build
      - name: Rust checks
        run: pnpm rust:check
      - name: TypeScript bindings are up to date
        run: git diff --exit-code -- src/lib/ipc/bindings

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage runs on more distributions.
          - platform: linux-x86_64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - platform: macos-universal
            os: macos-26
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-x86_64
            os: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf libfuse2 file xdg-utils
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.USE_CACHE == 'true'
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Release tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match the app version $version"
            exit 1
          fi
      - name: Sign the updater packages
        if: github.ref_type == 'tag'
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src-tauri/tauri.conf.json';
          const pubkey = process.env.UPDATER_PUBLIC_KEY?.trim();
          if (!pubkey || !process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) {
            throw new Error('Set TAURI_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY before releasing');
          }
          const config = JSON.parse(readFileSync(path, 'utf8'));
          config.bundle.createUpdaterArtifacts = true;
          config.plugins.updater.pubkey = pubkey;
          writeFileSync(path, JSON.stringify(config, null, 2));
          NODE
      - name: Generate icons from Icon Composer
        if: runner.os == 'macOS'
        run: pnpm icons
      - name: Generate icons from exported PNG
        if: runner.os != 'macOS'
        run: pnpm icons:png
      # beforeBuildCommand also regenerates the third-party licence notices shipped in the package.
      - name: Build desktop packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: pnpm tauri build --ci ${{ matrix.args }}
      # Tag builds add the updater signatures (.sig) and the macOS updater archive (.app.tar.gz).
      - name: Collect packages
        env:
          SIGNED: ${{ github.ref_type == 'tag' }}
        run: |
          mkdir -p artifacts
          case "$RUNNER_OS" in
            Linux)
              bundle=src-tauri/target/release/bundle
              cp "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage artifacts/
              if [ "$SIGNED" = true ]; then
                cp "$bundle"/deb/*.deb.sig "$bundle"/rpm/*.rpm.sig \
                  "$bundle"/appimage/*.AppImage.sig artifacts/
              fi
              ;;
            macOS)
              bundle=src-tauri/target/universal-apple-darwin/release/bundle
              ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Gem.app" \
                artifacts/Gem-macos-universal.app.zip
              cp "$bundle"/dmg/*.dmg artifacts/
              if [ "$SIGNED" = true ]; then
                cp "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig artifacts/
              fi
              ;;
            Windows)
              bundle=src-tauri/target/release/bundle
              cp "$bundle"/nsis/*.exe "$bundle"/msi/*.msi artifacts/
              if [ "$SIGNED" = true ]; then
                cp "$bundle"/nsis/*.exe.sig "$bundle"/msi/*.msi.sig artifacts/
              fi
              ;;
          esac
          ls -la artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gem-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish version release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment (Settings → Environments) to gate releases.
    environment: release
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Gem-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true
      # The in-app updater reads releases/latest/download/latest.json (ADR 0015).
      - name: Update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/update-manifest.mjs artifacts "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Only suffixed tags (v0.2.0-beta.1) are prereleases: the updater follows "latest",
          # which GitHub never points at a prerelease.
          prerelease=''
          case "$RELEASE_TAG" in *-*) prerelease='--prerelease' ;; esac
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Gem $RELEASE_TAG" $prerelease --generate-notes \
              --notes "See CHANGELOG.md. Packages are not code-signed; verify them with SHA256SUMS.txt before installing."
          fi
