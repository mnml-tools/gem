# ProFTPD for the Gem integration tests: plain FTP and explicit FTPS on port 21, with
# FEAT/MLSD/MLST (the machine-readable listing path). Test-only configuration.
ServerName "Gem test ProFTPD"
ServerType standalone
DefaultServer on
Port 21
UseIPv6 off
User nobody
Group nobody
Umask 022
MaxInstances 200
MaxClientsPerHost 100
TimeoutIdle 900
UseReverseDNS off
RequireValidShell off
AllowOverwrite on
# No chroot (no DefaultRoot): FTP paths are the same absolute paths as over SFTP.
PassivePorts 30080 30159
MasqueradeAddress 127.0.0.1
SystemLog /var/log/proftpd.log
TransferLog NONE

<IfModule mod_dso.c>
  LoadModule mod_tls.c
</IfModule>

<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired off
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/proftpd/tls/cert.pem
  TLSRSACertificateKeyFile /etc/proftpd/tls/key.pem
  TLSVerifyClient off
  # ProFTPD's default: data connections must reuse the control connection's TLS session.
  TLSLog /var/log/proftpd-tls.log
</IfModule>

<Directory /home/gem>
  AllowOverwrite on
</Directory>
