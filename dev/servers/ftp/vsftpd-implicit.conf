# vsftpd for the Gem integration tests: implicit FTPS (TLS from the first byte) on port 990.
# Test-only configuration; never use it on a real server.
listen=YES
listen_ipv6=NO
listen_port=990
background=NO
seccomp_sandbox=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chmod_enable=YES
# No chroot: FTP paths are the same absolute paths as over SFTP (/home/gem/...).
chroot_local_user=NO
allow_writeable_chroot=YES
dirmessage_enable=NO
ftpd_banner=Gem test vsftpd ready
hide_ids=NO
# Owner and group names (not uids) in LIST output.
text_userdb_names=YES
max_clients=200
max_per_ip=100
pasv_enable=YES
pasv_address=127.0.0.1
pasv_addr_resolve=NO
pasv_min_port=30040
pasv_max_port=30079
port_enable=YES
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
# Implicit TLS: every connection must be encrypted.
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
# vsftpd's default: data connections must resume the control connection's TLS session.
require_ssl_reuse=YES
ssl_ciphers=HIGH
rsa_cert_file=/etc/vsftpd/tls/cert.pem
rsa_private_key_file=/etc/vsftpd/tls/key.pem
implicit_ssl=YES
